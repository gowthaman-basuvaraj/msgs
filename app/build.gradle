plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace "the.waste.fellow.sms"
    compileSdk 34

    defaultConfig {
        applicationId "the.waste.fellow.sms"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 4
        versionName "3.0"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Custom-scheme redirect used by AppAuth for the Keycloak OAuth callback.
        manifestPlaceholders = [appAuthRedirectScheme: 'the.waste.fellow.sms']
    }

    signingConfigs {
        release {
            // Credentials come from the environment (injected by Jenkins) or -P Gradle
            // properties — never hard-coded. Left unset for local/debug builds.
            def storePath = System.getenv('RELEASE_STORE_FILE') ?: findProperty('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: findProperty('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: findProperty('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign only when a keystore is configured; otherwise the release APK is unsigned.
            if (System.getenv('RELEASE_STORE_FILE') ?: findProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.work.runtime.ktx
    implementation libs.appauth

    testImplementation libs.junit
}
